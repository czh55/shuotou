      <div class="meta">YYYY-MM-DD · TAG</div>
      <h1>TITLE</h1>
      <p class="one-liner">给外行人的一句话。</p>

      <section class="block">
        <h2>01 · 原材料</h2>
        <p>今天碰了什么：对象、场合、篇幅。</p>
      </section>

      <section class="block">
        <h2>02 · 外行一问</h2>
        <p>记者问「这是啥」时，你怎么答（短、完整、少术语）。</p>
      </section>

      <section class="block">
        <h2>03 · 来龙去脉</h2>
        <p>背景 → 发生了什么 → 为什么值得说。</p>
      </section>

      <section class="block">
        <h2>04 · 我的看法</h2>
        <p>我认为……因为……（禁止只复述内容。）</p>
      </section>

      <section class="block">
        <h2>05 · 追问预演</h2>
        <p><strong>追问：</strong></p>
        <p><strong>回答：</strong></p>
      </section>

      <section class="block">
        <h2>06 · 卡词备忘</h2>
        <ul>
          <li>卡住的说法 → 可替换的说法</li>
        </ul>
      </section>
